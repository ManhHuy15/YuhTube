AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Full Serverless Infrastructure for YuhTube Video Streaming Platform

# ==============================================================================
# PARAMETERS
# ==============================================================================
Parameters:
  DynamoDbTableName:
    Type: String
    Default: YuhTubeDB
    Description: DynamoDB Table Name for Single-Table Design

  RawBucketName:
    Type: String
    Default: yuhtube-s3-raw
    Description: S3 Bucket Name for Raw Video Uploads

  ProcessedBucketName:
    Type: String
    Default: yuhtube-s3-processed
    Description: S3 Bucket Name for Processed HLS Streams and Thumbnails

  CorsAllowOrigin:
    Type: String
    Default: "https://main.d22mhrksnsvwnc.amplifyapp.com"
    Description: Frontend Origin allowed for API Gateway and S3 CORS

# ==============================================================================
# GLOBALS
# ==============================================================================
Globals:
  Function:
    Runtime: dotnet10
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        DOTNET_ENVIRONMENT: "Production"
        AWS_LAMBDA_HANDLER_LOG_FORMAT: "Json"
        DynamoDb__TableName: !Ref DynamoDbTableName
        Storage__RawBucketName: !Ref RawBucketName
        Storage__ProcessedBucketName: !Ref ProcessedBucketName
        Storage__CdnBaseUrl: !Sub "https://${ProcessedVideoCdnDistribution.DomainName}"

# ==============================================================================
# RESOURCES
# ==============================================================================
Resources:

  # ----------------------------------------------------------------------------
  # 1. DATABASE: DynamoDB Single-Table
  # ----------------------------------------------------------------------------
  DynamoDbTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDbTableName
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1_PK, AttributeType: S }
        - { AttributeName: GSI1_SK, AttributeType: S }
        - { AttributeName: GSI2_PK, AttributeType: S }
        - { AttributeName: GSI2_SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1_PK, KeyType: HASH }
            - { AttributeName: GSI1_SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2_PK, KeyType: HASH }
            - { AttributeName: GSI2_SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  # ----------------------------------------------------------------------------
  # 2. STORAGE: Amazon S3 Buckets & Policies
  # ----------------------------------------------------------------------------
  RawBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref RawBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ["http://localhost:3000", !Ref CorsAllowOrigin]
            ExposedHeaders: ["ETag", "x-amz-server-side-encryption", "x-amz-request-id", "x-amz-id-2"]
            MaxAge: 3600

  RawBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${RawBucketName}"
              - !Sub "arn:aws:s3:::${RawBucketName}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  ProcessedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ProcessedBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ["http://localhost:3000", !Ref CorsAllowOrigin]
            ExposedHeaders: ["ETag", "x-amz-server-side-encryption", "x-amz-request-id", "x-amz-id-2"]
            MaxAge: 3600

  ProcessedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceSecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${ProcessedBucketName}"
              - !Sub "arn:aws:s3:::${ProcessedBucketName}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${ProcessedBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ProcessedVideoCdnDistribution}"

  # ----------------------------------------------------------------------------
  # 3. IAM: AWS Elemental MediaConvert Role
  # ----------------------------------------------------------------------------
  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "YuhTube-MediaConvertRole-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: mediaconvert.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaConvertS3AndLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::${RawBucketName}"
                  - !Sub "arn:aws:s3:::${RawBucketName}/*"
              - Effect: Allow
                Action: [s3:PutObject, s3:PutObjectAcl]
                Resource:
                  - !Sub "arn:aws:s3:::${ProcessedBucketName}"
                  - !Sub "arn:aws:s3:::${ProcessedBucketName}/*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "arn:aws:logs:*:*:*"

  # ----------------------------------------------------------------------------
  # 4. CDN: Amazon CloudFront (HLS Playback & Thumbnails with OAC)
  # ----------------------------------------------------------------------------
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "YuhTube-OAC-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CdnCorsResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "YuhTube-CdnCors-${AWS::StackName}"
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders: { Items: ["*"] }
          AccessControlAllowMethods: { Items: [GET, HEAD, OPTIONS] }
          AccessControlAllowOrigins: { Items: ["*"] }
          AccessControlMaxAgeSec: 3600
          OriginOverride: true

  ProcessedVideoCdnDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: "CloudFront CDN for YuhTube Processed HLS Videos and Thumbnails"
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: S3ProcessedBucketOrigin
            DomainName: !GetAtt ProcessedBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: S3ProcessedBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref CdnCorsResponseHeadersPolicy

  # ----------------------------------------------------------------------------
  # 5. API GATEWAY: HTTP API (v2) with CORS
  # ----------------------------------------------------------------------------
  YuhTubeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: YuhTubeAPI
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:3000"
          - !Ref CorsAllowOrigin
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: ["*"]
        MaxAge: 3600

  # ----------------------------------------------------------------------------
  # 6. LAMBDA FUNCTIONS
  # ----------------------------------------------------------------------------

  # --- 6.1. Upload API Lambda ---
  UploadApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: YuhTube-Upload-Lambda
      CodeUri: ../backend/src/YuhTube.Upload.Api/
      Handler: YuhTube.Upload.Api
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt DynamoDbTable.Arn
                - !Sub "${DynamoDbTable.Arn}/index/*"
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
              Resource:
                - !Sub "arn:aws:s3:::${RawBucketName}/*"
                - !Sub "arn:aws:s3:::${ProcessedBucketName}/*"
            - Effect: Allow
              Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/yuhtube/*"
      Events:
        Initiate:
          Type: HttpApi
          Properties:
            ApiId: !Ref YuhTubeHttpApi
            Path: /uploads
            Method: post
        CreateParts:
          Type: HttpApi
          Properties:
            ApiId: !Ref YuhTubeHttpApi
            Path: /uploads/{videoId}/parts
            Method: post
        Complete:
          Type: HttpApi
          Properties:
            ApiId: !Ref YuhTubeHttpApi
            Path: /uploads/{videoId}/complete
            Method: post
        Thumbnail:
          Type: HttpApi
          Properties:
            ApiId: !Ref YuhTubeHttpApi
            Path: /uploads/{videoId}/thumbnail
            Method: post

  # --- 6.2. Video API Lambda ---
  VideoApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: YuhTube-Video-Lambda
      CodeUri: ../backend/src/YuhTube.Video.Api/
      Handler: YuhTube.Video.Api
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !GetAtt DynamoDbTable.Arn
                - !Sub "${DynamoDbTable.Arn}/index/*"
            - Effect: Allow
              Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/yuhtube/*"
      Events:
        GetFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref YuhTubeHttpApi
            Path: /videos
            Method: get
        GetVideo:
          Type: HttpApi
          Properties:
            ApiId: !Ref YuhTubeHttpApi
            Path: /videos/{id}
            Method: get
        UpdateVideo:
          Type: HttpApi
          Properties:
            ApiId: !Ref YuhTubeHttpApi
            Path: /videos/{id}
            Method: put

  # --- 6.3. MediaConvert Coordinator Lambda ---
  MediaConvertCoordinatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: YuhTube-MediaConvert-Lambda
      CodeUri: ../backend/src/YuhTube.MediaConvertCoordinator/
      Handler: YuhTube.MediaConvertCoordinator::YuhTube.MediaConvertCoordinator.Function::FunctionHandler
      Environment:
        Variables:
          MediaConvert__RoleArn: !GetAtt MediaConvertRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt DynamoDbTable.Arn
            - Effect: Allow
              Action: [s3:GetObject, s3:ListBucket]
              Resource:
                - !Sub "arn:aws:s3:::${RawBucketName}"
                - !Sub "arn:aws:s3:::${RawBucketName}/*"
            - Effect: Allow
              Action: [mediaconvert:CreateJob, mediaconvert:GetJob, mediaconvert:DescribeEndpoints]
              Resource: "*"
            - Effect: Allow
              Action: [iam:PassRole]
              Resource: !GetAtt MediaConvertRole.Arn
            - Effect: Allow
              Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/yuhtube/*"
      Events:
        RawVideoUploaded:
          Type: S3
          Properties:
            Bucket: !Ref RawBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/

  # --- 6.4. Transcode Status Updater Lambda ---
  TranscodeStatusUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: YuhTube-TranscodeStatusUpdater-Lambda
      CodeUri: ../backend/src/YuhTube.TranscodeStatusUpdater/
      Handler: YuhTube.TranscodeStatusUpdater::YuhTube.TranscodeStatusUpdater.Function::FunctionHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource:
                - !GetAtt DynamoDbTable.Arn
                - !Sub "${DynamoDbTable.Arn}/index/*"
            - Effect: Allow
              Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/yuhtube/*"
      Events:
        MediaConvertStatus:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["aws.mediaconvert"]
              detail-type: ["MediaConvert Job State Change"]
              detail:
                status: ["COMPLETE", "ERROR"]

# ==============================================================================
# OUTPUTS
# ==============================================================================
Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Base Endpoint
    Value: !Sub "https://${YuhTubeHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  CdnBaseUrl:
    Description: CloudFront CDN Base URL for HLS Playback and Thumbnails
    Value: !Sub "https://${ProcessedVideoCdnDistribution.DomainName}"

  CdnDistributionId:
    Description: CloudFront CDN Distribution ID
    Value: !Ref ProcessedVideoCdnDistribution

  DynamoDbTableName:
    Description: Managed DynamoDB Table Name
    Value: !Ref DynamoDbTable

  RawBucketName:
    Description: Managed Raw S3 Bucket Name
    Value: !Ref RawBucket

  ProcessedBucketName:
    Description: Managed Processed S3 Bucket Name
    Value: !Ref ProcessedBucket

  MediaConvertRoleArn:
    Description: Managed IAM Role ARN for MediaConvert
    Value: !GetAtt MediaConvertRole.Arn
